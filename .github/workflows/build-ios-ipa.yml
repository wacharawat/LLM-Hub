name: Build iOS IPA (auto)

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/build-ios-ipa.yml"

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: xcode-27   # macOS + Xcode 27 preview (Swift 6.3 ต้องใช้สำหรับ mlx-swift 0.31.6+)
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Select newest installed Xcode (Swift 6.2+ ต้องใช้ Xcode 26+)
        run: |
          set -euo pipefail
          echo "Installed Xcodes:"
          ls -d /Applications/Xcode*.app || true
          BEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
            | sed -E 's#.*/Xcode_([0-9.]+)\.app#\1#' \
            | sort -V | tail -n1 || true)
          if [ -n "${BEST:-}" ]; then
            echo "Selecting Xcode_${BEST}.app"
            sudo xcode-select -s "/Applications/Xcode_${BEST}.app"
          fi
          xcodebuild -version
          swift --version

      - name: Show schemes
        run: |
          xcodebuild -list -project ios/LLMHub/LLMHub.xcodeproj

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/LLMHub/LLMHub.xcodeproj \
            -scheme LLMHub

      - name: Build (unsigned, premium unlocked via Secrets xcconfig)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/LLMHub/LLMHub.xcodeproj \
            -scheme LLMHub \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/LLMHub.app"
          test -d "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload LLMHub-unsigned.ipa
          rm -rf Payload
          ls -lh LLMHub-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7.0.1
        with:
          name: LLMHub-ipa
          path: LLMHub-unsigned.ipa
          retention-days: 30

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-build-log
          path: build.log
          retention-days: 7
